<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Operations | The Herd Co.</title>
<meta name="theme-color" content="#163823">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Herd Ops">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="../assets/ops-config.js"></script>
<style>
  :root{
    --green:#163823; --green-2:#1f4a30; --ink:#1b211d; --muted:#5b665f;
    --paper:#f6f4ee; --card:#fff; --line:#dfdbd0; --tan:#c9b48a; --soft:#eef0ea;
    --red:#a33a2a; --red-bg:#fbeae6; --amber:#8a6212; --amber-bg:#fbf1dc; --blue:#2a5d8a;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.45}
  a{color:var(--green)}
  h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1.05;margin:0;color:var(--green)}
  h2{font-size:1.6rem} h3{font-size:1.15rem}
  button,input,select,textarea{font:inherit;color:inherit}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .small{font-size:.86rem}

  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border:0;font-weight:600;padding:9px 16px;border-radius:999px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--green-2)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--line)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.danger{background:transparent;color:var(--red);border:1.5px solid #e5c4bd}
  .btn.sm{padding:6px 12px;font-size:.88rem}
  .linkbtn{background:none;border:0;color:var(--green);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--green)}
  #login form{background:var(--card);border-radius:18px;padding:34px 30px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  #login img{height:44px;display:block;margin:0 auto 18px}
  #login h1{text-align:center;font-size:1.5rem;margin-bottom:20px}
  #login .err{color:var(--red);min-height:1.3em;margin:10px 0 0;font-size:.92rem}
  .pw{position:relative}
  .pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:.85rem;font-weight:600}
  .check{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:.92rem;color:var(--muted)}
  #login .btn{width:100%;justify-content:center;padding:12px}

  /* fields */
  label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  input[type=text],input[type=email],input[type=tel],input[type=url],input[type=date],input[type=number],input[type=password],input[type=search],select,textarea{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;font-size:1rem;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
  textarea{resize:vertical;min-height:90px;line-height:1.45}
  textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;min-height:260px}
  input:focus,select:focus,textarea:focus{outline:2px solid rgba(22,56,35,.25);border-color:var(--green)}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .span2{grid-column:span 2}.span3{grid-column:1/-1}
  @media (max-width:640px){.grid,.grid.three{grid-template-columns:1fr}.span2{grid-column:auto}}

  /* shell */
  header.top{position:sticky;top:0;z-index:20;background:var(--green);color:#fff}
  header.top .bar{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1400px;margin:0 auto}
  header.top img{height:28px}
  header.top .title{font-family:"Barlow Condensed";text-transform:uppercase;font-weight:700;letter-spacing:.06em;font-size:19px;line-height:1;color:var(--tan);position:relative;top:-7.75px;margin-left:2px}
  header.top .sp{flex:1}
  header.top input[type=search]{max-width:240px;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2);color:#fff}
  header.top input[type=search]::placeholder{color:rgba(255,255,255,.6)}
  header.top .btn.light{background:#fff;color:var(--green)}
  .menu{position:relative}
  .menu > button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:1.2rem}
  .menu .pop{position:absolute;right:0;top:44px;background:#fff;color:var(--ink);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);min-width:210px;padding:6px;z-index:30}
  .menu .pop a,.menu .pop button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-radius:7px;cursor:pointer;text-decoration:none;color:var(--ink)}
  .menu .pop a:hover,.menu .pop button:hover{background:var(--soft)}
  nav.tabs{display:flex;gap:4px;padding:0 18px;max-width:1400px;margin:0 auto;overflow-x:auto}
  nav.tabs button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  nav.tabs button.on{color:#fff;border-bottom-color:var(--tan)}
  main{max-width:1400px;margin:0 auto;padding:22px 18px 80px}
  @media (max-width:720px){header.top input[type=search]{display:none} header.top .title{display:none}}
  .mobile-search{display:none;margin-bottom:14px}
  @media (max-width:720px){.mobile-search{display:block}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .kpi .lbl{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  .kpi .val{font-family:"Barlow Condensed";font-weight:700;font-size:2.2rem;color:var(--green);line-height:1.1;margin-top:4px}
  .kpi .sub{font-size:.88rem;color:var(--muted)}
  .cols2{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
  @media (max-width:900px){.cols2{grid-template-columns:1fr}}
  .list{list-style:none;margin:10px 0 0;padding:0}
  .list li{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
  .list li:first-child{border-top:0}
  .list li:hover .nm{text-decoration:underline}
  .list .nm{font-weight:600}
  .list .rt{margin-left:auto;white-space:nowrap;font-size:.88rem}
  .empty{color:var(--muted);padding:10px 0;font-size:.95rem}
  .flag{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .flag.red{background:var(--red-bg);color:var(--red)} .flag.amber{background:var(--amber-bg);color:var(--amber)} .flag.green{background:var(--soft);color:var(--green)}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;border:1px solid transparent}
  .st-lead{background:#e9eef6;color:#2a4d7a}
  .st-discussion{background:#fbf1dc;color:#7a5510}
  .st-future{background:#efe9f5;color:#5d3f7c}
  .st-contract{background:#e3efe6;color:#1f5a33}
  .st-live{background:var(--green);color:#fff}
  .st-closed{background:#ececea;color:#6b6b66}

  /* board */
  .board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
  .col{background:#ebe8df;border-radius:var(--radius);padding:10px;min-height:120px}
  .col.drop{outline:2px dashed var(--green);outline-offset:-4px}
  .col h3{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;font-size:1rem}
  .col h3 .ct{font-family:Barlow;font-size:.82rem;color:var(--muted);font-weight:600}
  .tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
  .tile:hover{border-color:#bdb8a9}
  .tile.dragging{opacity:.4}
  .tile .nm{font-weight:600}
  .tile .meta{font-size:.84rem;color:var(--muted);margin-top:2px}
  .tile .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:.82rem}
  .tile{min-width:0;overflow-wrap:anywhere}
  .tile .foot>*{min-width:0;max-width:100%}
  .tile .foot a{overflow-wrap:anywhere;word-break:break-word}
  .tile .money{margin-left:auto;font-weight:600;color:var(--green)}

  /* tables */
  .tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
  table{border-collapse:collapse;width:100%;font-size:.94rem}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:#faf9f5;white-space:nowrap;cursor:pointer;user-select:none}
  tbody tr{cursor:pointer} tbody tr:hover{background:#faf9f5}
  td a{word-break:break-all}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar h2{margin-right:auto}
  .toolbar select{width:auto}

  /* drawer */
  #drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(15,25,18,.35)}
  #drawer .panel{background:var(--paper);width:min(880px,100%);height:100%;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
  #drawer .dhead{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px 0}
  #drawer .dhead .row1{display:flex;gap:12px;align-items:center}
  #drawer .dhead h2{font-size:1.5rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #drawer .dhead select{width:auto;font-weight:600}
  #drawer .x{background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--muted);line-height:1;padding:4px}
  #drawer .dtabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto}
  #drawer .dtabs button{background:none;border:0;padding:9px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  #drawer .dtabs button.on{color:var(--green);border-bottom-color:var(--green)}
  #drawer .dbody{flex:1;overflow-y:auto;padding:20px}
  #drawer .dfoot{background:#fff;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center}
  #drawer .dfoot .state{margin-right:auto;font-size:.9rem;color:var(--muted)}
  #drawer .dfoot .state.dirty{color:var(--amber);font-weight:600}
  .section{margin-bottom:22px}
  .section > h3{margin-bottom:12px}
  .hint{font-size:.85rem;color:var(--muted);margin:6px 0 0}
  .calc{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.95rem}
  .calc b{color:var(--green)}
  .open{font-size:.8rem;font-weight:600;margin-left:6px;text-transform:none;letter-spacing:0}

  .timeline{list-style:none;padding:0;margin:14px 0 0}
  .timeline li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .timeline li.sys{background:transparent;border-style:dashed;font-size:.88rem;color:var(--muted);padding:6px 12px}
  .timeline .when{font-size:.78rem;color:var(--muted);display:flex;gap:8px;align-items:center}
  .timeline .when .linkbtn{margin-left:auto;font-size:.78rem;color:var(--muted)}
  .timeline .txt{white-space:pre-wrap;margin-top:4px}
  .files{list-style:none;padding:0;margin:14px 0 0}
  .files li{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .files .ic{width:36px;height:36px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--green);flex:none}
  .files .nm{font-weight:600;word-break:break-word}
  .files .acts{margin-left:auto;display:flex;gap:8px;flex:none}

  /* spec sheet */
  #spec{position:fixed;inset:0;z-index:60;background:#fff;overflow-y:auto}
  #spec .sbar{position:sticky;top:0;background:var(--green);color:#fff;display:flex;gap:10px;padding:10px 18px;align-items:center}
  #spec .sbar .sp{flex:1}
  #spec .doc{max-width:820px;margin:0 auto;padding:30px 24px 60px}
  #spec .doc header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--green);padding-bottom:14px;margin-bottom:18px;gap:16px}
  #spec .doc header img{height:34px}
  #spec h1{font-size:2rem}
  #spec dl{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;margin:0 0 22px;font-size:.95rem}
  #spec dt{font-weight:600;color:var(--muted)}
  #spec dd{margin:0;word-break:break-word;white-space:pre-wrap}
  .md h1,.md h2,.md h3{margin:18px 0 8px}
  .md h1{font-size:1.5rem}.md h2{font-size:1.3rem}.md h3{font-size:1.1rem}
  .md p{margin:8px 0}
  .md ul,.md ol{margin:6px 0;padding-left:22px}
  .md code{background:var(--soft);padding:1px 5px;border-radius:4px;font-size:.88em}
  .md pre{background:#1b211d;color:#eef0ea;padding:12px 14px;border-radius:8px;overflow-x:auto;font-size:.85rem}
  .md pre code{background:none;padding:0}
  @media print{
    body > *:not(#spec){display:none !important}
    #spec{position:static} #spec .sbar{display:none}
    #spec .doc{padding:0}
  }

  /* modal + toast */
  .modal{position:fixed;inset:0;z-index:70;background:rgba(15,25,18,.45);display:grid;place-items:center;padding:20px}
  .modal .box{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
  .modal .box h2{margin-bottom:16px}
  .modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
  .modal .err{color:var(--red);font-size:.92rem;min-height:1.2em;margin-top:10px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  #toast.err{background:var(--red)}
  .loading{padding:60px 0;text-align:center;color:var(--muted)}
  .sync{font-size:.78rem;font-weight:600;letter-spacing:.04em;color:rgba(255,255,255,.75);white-space:nowrap}
  .sync.hidden{display:none}
  .scope{margin-left:auto;display:flex;gap:4px;align-items:center;padding:6px 0}
  .scope button{background:rgba(255,255,255,.1);border:0;color:rgba(255,255,255,.75);padding:5px 12px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer}
  .scope button.on{background:var(--tan);color:var(--green)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c9c6bc;vertical-align:middle}
  .dot.ok{background:#3c8a54}.dot.bad{background:var(--red)}
  .tbadge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .chk{width:100%;border-collapse:collapse;margin-top:6px}
  .chk td{padding:6px 6px 6px 0;border:0;vertical-align:middle}
  .chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--green)}
  .chk input[type=number]{width:90px}
  .chk tr.done input[type=text]{text-decoration:line-through;color:var(--muted)}
  .paylist{list-style:none;padding:0;margin:12px 0 0}
  .paylist li{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:.95rem}
  .paylist .amt{font-weight:700;color:var(--green);min-width:90px}
  .paylist .linkbtn{margin-left:auto;color:var(--red);font-size:.85rem}
  .pbar{display:block;height:8px;background:var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
  .pbar span{display:block;height:100%;background:var(--green)}
  .fab{display:none;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;background:var(--green);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:1rem}
  @media (max-width:720px){.fab{display:block} header.top .btn.light{display:none}}
  .seg{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
  .seg button{background:transparent;color:#fff;border:0;padding:6px 12px;font-weight:600;cursor:pointer;font-size:.85rem}
  .seg button.on{background:#fff;color:var(--green)}
  .lc-preview{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;background:none;border:0;padding:6px 2px 0;cursor:pointer;font:inherit;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);font-size:.9rem;white-space:pre-wrap}
  .lc-preview .lc-more{color:var(--green);font-weight:600;font-size:.85rem}
  .lc-preview:hover span:first-child{color:var(--ink)}
  .tl-item{cursor:pointer}
  .tl-item:hover{border-color:#bdb8a9}
  .tl-item .txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .modal .box.msg{max-width:560px}
  .msg-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
  .msg-head .x{margin-left:auto;background:none;border:0;font-size:1.6rem;cursor:pointer;color:var(--muted);line-height:1}
  .msg-ic{font-size:1.6rem;width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
  .msg-body{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:1rem;line-height:1.5;max-height:50vh;overflow-y:auto;word-break:break-word}
  .msg-others{list-style:none;padding:0;margin:0}
  .msg-others button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;cursor:pointer;font:inherit;font-size:.92rem}
  .msg-others button:hover{border-color:#bdb8a9}
  .mscope{display:none}
  .mcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
  .mcard .mrow{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .mcard .mlinks{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.92rem}
  .mcard .mlinks a{word-break:normal}

  @media (max-width:720px){
    main{padding:14px 12px 110px}
    .scope{display:none}
    .mobile-search{display:flex;gap:8px;align-items:center}
    .mobile-search input{flex:1}
    .mscope{display:inline-flex;background:#e9e6dc;border-radius:999px;padding:3px;flex:none}
    .mscope button{border:0;background:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:.85rem;color:var(--muted)}
    .mscope button.on{background:var(--green);color:#fff}
    nav.tabs{padding:0 6px}
    nav.tabs button{padding:10px 11px}
    .toolbar{gap:8px}
    .toolbar h2{font-size:1.4rem;width:100%}
    .toolbar .muted.small{display:none}
    .board{grid-auto-columns:84vw;scroll-snap-type:x mandatory;margin:0 -12px;padding:0 12px 10px}
    .col{scroll-snap-align:start}
    .card{padding:14px}
    .list li{flex-wrap:wrap;gap:4px 10px}
    .list .rt{margin-left:0}
    #drawer .panel{width:100%}
    #drawer .dhead{padding:10px 14px 0}
    #drawer .dhead .row1{flex-wrap:wrap;gap:8px}
    #drawer .dhead h2{order:1;flex:1 1 calc(100% - 44px);white-space:normal;font-size:1.3rem;line-height:1.1}
    #drawer .x{order:2}
    #drawer .dhead select{order:3;flex:1 1 100%}
    #drawer .dtabs{margin:8px -14px 0;padding:0 8px}

<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <form id="loginForm" autocomplete="on">
    <img src="../assets/logo-full.png" alt="The Herd Co.">
    <h1>Operations</h1>
    <input type="text" name="username" value="herd-admin" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
    <label class="f">Password
      <span class="pw"><input type="password" id="pw" autocomplete="current-password" required><button type="button" id="pwShow">Show</button></span>
    </label>
    <label class="check"><input type="checkbox" id="remember"> Keep me signed in on this device (30 days)</label>
    <button class="btn" type="submit" id="loginBtn">Unlock</button>
    <p class="err" id="loginErr" role="alert"></p>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <div class="bar">
      <a href="../" aria-label="herdcoindy.com"><img src="../assets/logo-white.png" alt="The Herd Co."></a>
      <span class="title">Operations</span>
      <span class="sync hidden" id="syncNote">Syncing…</span>
      <span class="sp"></span>
      <input type="search" id="q" placeholder="Search clients, notes, URLs…">
      <button class="btn light sm" id="newBtn">+ New</button>
      <div class="menu">
        <button id="menuBtn" aria-label="Menu">⋯</button>
        <div class="pop hidden" id="menuPop">
          <a id="sheetLink" target="_blank" rel="noopener">Open the Google Sheet</a>
          <a id="folderLink" target="_blank" rel="noopener">Open contracts folder</a>
          <button id="refreshBtn">Refresh data</button>
          <button id="settingsBtn">Settings &amp; automations</button>
          <button id="pwBtn">Change password</button>
          <button id="logoutBtn">Sign out</button>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-view="dash" class="on">Dashboard</button>
      <button data-view="board">Pipeline</button>
      <button data-view="sites">Sites</button>
      <button data-view="all">All projects</button>
      <span class="scope" id="scope"><button data-scope="client">Clients</button><button data-scope="all">Everything</button></span>
    </nav>
  </header>
  <main id="main"><div class="loading">Loading…</div></main>
  <footer class="ft"><img src="../assets/icon.png" alt=""><span>&copy; <span id="yr">2026</span> The Herd Co. · Greenwood / Indianapolis, Indiana</span></footer>
</div>

<button class="fab hidden" id="fab">+ Lead</button>
<div id="drawer" class="hidden"></div>
<div id="spec" class="hidden"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="hidden" role="status"></div>

<script>
(function(){
'use strict';

/* ================= config ================= */
var API = (window.HERD_OPS && window.HERD_OPS.api) || '';
var TOKEN_KEY = 'herdOpsToken';
var STAGES = [
  {k:'lead',       label:'Lead',           hint:'New inquiry, not yet talked'},
  {k:'discussion', label:'In discussion',  hint:'Consult / scoping / proposal out'},
  {k:'contract',   label:'Under contract', hint:'Signed, building'},
  {k:'live',       label:'Live',           hint:'Delivered and running'},
  {k:'future',     label:'Future',         hint:'Parked — revisit later'},
  {k:'closed',     label:'Closed',         hint:'Won & done, passed, lost, or retired'}
];
var STAGE = {}; STAGES.forEach(function(s){ STAGE[s.k]=s; });
var SERVICES = ['Event site','Group site','Operations tool','AI agent','Not sure yet','Other'];
var SOURCES = ['Website form','Referral','Friend / network','Repeat client','Social','Other'];
var FILE_KINDS = ['Executed contract','Proposal / SOW','Change order','Invoice','Receipt','Handoff doc','Other'];
var LOG_TYPES = ['note','text','call','email','face-to-face','meeting'];
var CONTACT_TYPES = [{k:'text',label:'Text',ic:'💬'},{k:'call',label:'Call',ic:'📞'},{k:'email',label:'Email',ic:'✉️'},{k:'face-to-face',label:'Face-to-face',ic:'🤝'}];
var CONTACT_KEYS = {text:1,call:1,email:1,'face-to-face':1,meeting:1};
var TYPES = [{k:'client',label:'Client'},{k:'internal',label:'Internal'},{k:'personal',label:'Personal'}];
var PAY_METHODS = ['Venmo','Check','ACH / Found','Card','Cash','Other'];
var WON_DONE = 'Won, done';
function isWonDone(p){ return p.stage==='closed' && p.closedReason===WON_DONE; }
var CLOSE_REASONS = [WON_DONE,'Lost — price','Lost — timing','Went with someone else','Not a fit','No response','Retired / sunset','Other'];
var DEFAULT_STEPS = ['Consult','Deploy','Test / validate','Handoff'];

var SITE_KIT_TEMPLATE = [
'## Pattern',
'Herd Co. Site Kit — GitHub Pages front end + Google Sheet / Apps Script backend + hidden passcode /admin.',
'',
'## Front end',
'- Repo: ',
'- Served from: `docs/` on GitHub Pages (custom domain via CNAME)',
'- `docs/config.js`: apiUrl, name, cacheKey, sections, labels',
'- Brand colors: top of `style.css`',
'',
'## Back end',
'- Google Sheet (client\'s account): ',
'- Tabs: Settings, Agenda, News, Links',
'- Public tabs (PUBLIC_TABS): ',
'- Private tabs: ',
'- Apps Script web app: Execute as Me / Anyone. Code change → Manage deployments → New version (keeps URL).',
'',
'## Admin',
'- `/admin` passcode stored in Script Properties (set with NEW_PASSCODE + setPasscode()).',
'- 10 wrong tries → 15-min lockout.',
'',
'## Accounts & ownership',
'- Domain registrar: ',
'- Google account that owns the Sheet: ',
'- GitHub owner: ',
'',
'## How to make changes',
'1. ',
'',
'## Gotchas',
'- ',
'',
'## Internal notes',
'- Where keys/passcodes live (never the values): ',
'- Billing / care plan: '
].join('\n');

/* ================= state ================= */
var S = { projects:[], log:[], files:[], payments:[], health:[], settings:{}, sheetUrl:'', folderUrl:'', view:'dash', q:'', sort:{k:'updated',dir:-1}, stageFilter:'open', scope:'client' };
try{ localStorage.removeItem('herdOpsScope'); }catch(e){} // always open on Clients
var D = null; // drawer state {id, draft, tab, dirty}

/* ================= helpers ================= */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function safeUrl(u){ u=String(u||'').trim(); if(!u) return ''; if(!/^[a-z]+:/i.test(u)) u='https://'+u; return /^(https?:|mailto:|tel:)/i.test(u)?u:''; }
function link(u, text){ var s=safeUrl(u); return s?'<a href="'+esc(s)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+esc(text||u)+'</a>':esc(text||u||''); }
function host(u){ try{ return new URL(safeUrl(u)).host.replace(/^www\./,'') + new URL(safeUrl(u)).pathname.replace(/\/$/,''); }catch(e){ return u; } }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ var d=new Date(s+'T12:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayDiff(s){ if(!s) return null; var a=new Date(String(s).slice(0,10)+'T12:00:00'), b=new Date(todayStr()+'T12:00:00'); return Math.round((a-b)/864e5); }
function fmtDate(s){ if(!s) return ''; var d=new Date(String(s).slice(0,10)+'T12:00:00'); if(isNaN(d)) return esc(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year: d.getFullYear()===new Date().getFullYear()?undefined:'numeric'}); }
function fmtTs(s){ var d=new Date(s); if(isNaN(d)) return esc(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function num(v){ var n=parseFloat(String(v==null?'':v).replace(/[$,]/g,'')); return isNaN(n)?0:n; }
function money(v){ var n=num(v); return '$'+n.toLocaleString(undefined,{maximumFractionDigits: n%1?2:0}); }
function rel(s){ var d=dayDiff(s); if(d===null) return ''; if(d===0) return 'today'; if(d===1) return 'tomorrow'; if(d===-1) return 'yesterday'; return d>0?'in '+d+' days':Math.abs(d)+' days ago'; }
function pill(stage){ var s=STAGE[stage]||{label:stage||'—'}; return '<span class="pill st-'+esc(stage)+'">'+esc(s.label)+'</span>'; }
function byId(id){ return S.projects.filter(function(p){ return String(p.id)===String(id); })[0]; }
function title(p){ return p.name || p.org || p.contactName || 'Untitled'; }
function filesFor(id){ return S.files.filter(function(f){ return String(f.projectId)===String(id); }); }
function logFor(id){ return S.log.filter(function(l){ return String(l.projectId)===String(id); }).sort(function(a,b){ return String(b.ts).localeCompare(String(a.ts)); }); }
function typeOf(p){ if(p.type) return p.type; if(/personal/i.test(p.org||'')) return 'personal'; if(/^levi mcneely/i.test(p.contactName||'')) return 'internal'; return 'client'; }
function inScope(p){ return S.scope==='all' || typeOf(p)==='client'; }
function paymentsFor(id){ return S.payments.filter(function(x){ return String(x.projectId)===String(id); }).sort(function(a,b){ return String(b.date).localeCompare(String(a.date)); }); }
function paidFor(p){ var ps=paymentsFor(p.id); return ps.length ? ps.reduce(function(t,x){ return t+num(x.amount); },0) : num(p.paid); }
function healthFor(id){ return S.health.filter(function(h){ return String(h.projectId)===String(id); }); }
function healthDot(id){ var h=healthFor(id); if(!h.length) return '<span class="dot" title="Not checked"></span>'; var bad=h.filter(function(x){ return x.ok==='no'; }); return bad.length?'<span class="dot bad" title="'+esc(bad.map(function(b){ return b.kind+': '+b.detail; }).join(' | '))+'"></span>':'<span class="dot ok" title="All checks passing"></span>'; }
function localDay(ts){ var d=new Date(ts); if(isNaN(d)) return String(ts||'').slice(0,10); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lastTouch(p){
  var best=null;
  S.log.forEach(function(l){ if(String(l.projectId)!==String(p.id) || !CONTACT_KEYS[l.type]) return; var d=localDay(l.ts); if(!best || d>best.date || (d===best.date && String(l.ts)>best.ts)) best={date:d, ts:String(l.ts), type:l.type, text:l.text, id:l.id}; });
  if(p.lastContact && (!best || p.lastContact>best.date)) best={date:p.lastContact, ts:'', type:'email', text:''};
  return best;
}
function lastContactOf(p){ var t=lastTouch(p); return t ? t.date : String(p.created||'').slice(0,10); }
function fmtPhone(v){
  var raw=String(v||''), d=raw.replace(/\D/g,'');
  if(/^\s*\+/.test(raw) && d[0]!=='1') return raw; // international: leave as typed
  var cc='';
  if(d.length>10 && d[0]==='1'){ cc='+1 '; d=d.slice(1); }
  var ext=d.slice(10); d=d.slice(0,10);
  var out = d.length<=3 ? (d.length?'('+d:'') : d.length<=6 ? '('+d.slice(0,3)+') '+d.slice(3) : '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6);
  return cc+out+(ext?' x'+ext:'');
}
function checklistOf(p){ try{ var c=JSON.parse(p.checklist||'[]'); if(Array.isArray(c)&&c.length) return c; }catch(e){} return DEFAULT_STEPS.map(function(x){ return {s:x,done:false,min:'',date:''}; }); }
function isOpen(p){ return p.stage==='lead'||p.stage==='discussion'||p.stage==='contract'||p.stage==='future'; }

function toast(msg, err){ var t=$('#toast'); t.textContent=msg; t.className=err?'err':''; clearTimeout(toast._t); toast._t=setTimeout(function(){ t.className='hidden'; }, err?5000:2400); }

/* ================= api ================= */
function getToken(){ try{ return localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || ''; }catch(e){ return ''; } }
function setToken(t, remember){ try{ localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); (remember?localStorage:sessionStorage).setItem(TOKEN_KEY,t); }catch(e){} }
function clearToken(){ try{ localStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(TOKEN_KEY); }catch(e){} clearCache(); }
/* Last-loaded data, kept in the same place as the sign-in (this device only if "keep me signed in"),
   so the dashboard paints instantly and refreshes in the background. */
var CACHE_KEY='herdOpsCache';
function cacheStore(){ try{ return localStorage.getItem(TOKEN_KEY)?localStorage:sessionStorage; }catch(e){ return null; } }
function readCache(){ try{ var st=cacheStore(), raw=st&&st.getItem(CACHE_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }
function saveCache(){ try{ var st=cacheStore(); if(!st||!getToken()) return; st.setItem(CACHE_KEY, JSON.stringify({projects:S.projects,log:S.log,files:S.files,payments:S.payments,health:S.health,settings:S.settings,sheetUrl:S.sheetUrl,folderUrl:S.folderUrl})); }catch(e){} }
function clearCache(){ try{ localStorage.removeItem(CACHE_KEY); sessionStorage.removeItem(CACHE_KEY); }catch(e){} }
function api(action, data){
  var body = Object.assign({action:action, token:getToken()}, data||{});
  return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .catch(function(){ throw new Error('Could not reach the server. Open the backend /exec URL in a private window: it should show {"ok":true,"app":"herd-ops"}. If it asks you to sign in, set the deployment\'s access to "Anyone".'); })
    .then(function(r){ return r.text().then(function(t){ try{ return JSON.parse(t); }catch(e){ throw new Error('The server answered, but not with data (HTTP '+r.status+'). Usually this means setup() was not run, or the deployment is out of date. Redeploy as a New version.'); } }); })
    .then(function(j){
      if(j.auth===false){ clearToken(); showLogin('Your session ended — please sign in again.'); throw new Error('signed out'); }
      if(!j.ok) throw new Error(j.error||'Something went wrong');
      return j;
    });
}

/* ================= login ================= */
function showLogin(msg){
  $('#app').classList.add('hidden'); $('#drawer').classList.add('hidden'); $('#fab').classList.add('hidden'); D=null;
  $('#login').classList.remove('hidden');
  $('#loginErr').textContent = msg||'';
  setTimeout(function(){ $('#pw').focus(); }, 50);
}
$('#pwShow').onclick=function(){ var i=$('#pw'); i.type=i.type==='password'?'text':'password'; this.textContent=i.type==='password'?'Show':'Hide'; };
$('#loginForm').onsubmit=function(e){
  e.preventDefault();
  var b=$('#loginBtn'), remember=$('#remember').checked;
  b.disabled=true; b.textContent='Checking…'; $('#loginErr').textContent='';
  api('login',{password:$('#pw').value, remember:remember}).then(function(j){
    setToken(j.token, remember); $('#pw').value='';
    $('#login').classList.add('hidden'); boot();
  }).catch(function(err){ if(err.message!=='signed out') $('#loginErr').textContent=err.message; })
    .finally(function(){ b.disabled=false; b.textContent='Unlock'; });
};

/* ================= boot ================= */
function applyData(j){
  S.projects=j.projects||[]; S.log=j.log||[]; S.files=j.files||[]; S.payments=j.payments||[]; S.health=j.health||[]; S.settings=j.settings||{};
  S.sheetUrl=j.sheetUrl||''; S.folderUrl=j.folderUrl||'';
  $('#sheetLink').href=S.sheetUrl||'#'; $('#folderLink').href=S.folderUrl||'#';
}
function boot(){
  $('#app').classList.remove('hidden');
  var cached=readCache(), opened=false;
  function openFromHash(){ if(opened) return; var m=location.hash.match(/^#p=(.+)$/); if(m && byId(decodeURIComponent(m[1]))){ opened=true; openProject(decodeURIComponent(m[1])); } }
  if(cached){ applyData(cached); $('#fab').classList.remove('hidden'); render(); openFromHash(); }
  else $('#main').innerHTML='<div class="loading">Loading…</div>';
  $('#syncNote').classList.remove('hidden');
  return api('bootstrap').then(function(j){
    applyData(j);
    $('#fab').classList.remove('hidden');
    render(true); saveCache();
    if(D && !D.dirty && byId(D.id)){ D.draft=Object.assign({}, byId(D.id)); drawDrawer(); }
    openFromHash();
  }).catch(function(err){
    if(err.message==='signed out') return;
    if(cached) toast('Showing saved data — couldn’t refresh: '+err.message, true);
    else $('#main').innerHTML='<div class="loading">'+esc(err.message)+' <button class="linkbtn" id="retry">Try again</button></div>', $('#retry')&&($('#retry').onclick=boot);
  }).finally(function(){ $('#syncNote').classList.add('hidden'); });
}

/* ================= views ================= */
$('#tabs').onclick=function(e){ var b=e.target.closest('button[data-view]'); if(!b) return; S.view=b.dataset.view; $$('#tabs button').forEach(function(x){ x.classList.toggle('on',x===b); }); render(); window.scrollTo(0,0); };
function paintScope(){ $$('#scope button').forEach(function(b){ b.classList.toggle('on', b.dataset.scope===S.scope); }); }
$('#scope').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; S.scope=b.dataset.scope; paintScope(); render(); };
paintScope();
$('#q').oninput=function(){ S.q=this.value; var m=$('#q2'); if(m) m.value=this.value; if(S.view==='dash'&&S.q){ S.view='all'; $$('#tabs button').forEach(function(x){ x.classList.toggle('on',x.dataset.view==='all'); }); } render(true); };

function matches(p){
  if(!S.q) return true;
  var q=S.q.toLowerCase();
  var hay=PROJECT_TEXT_FIELDS.map(function(k){ return p[k]; }).join(' ')+' '+logFor(p.id).map(function(l){ return l.text; }).join(' ');
  return hay.toLowerCase().indexOf(q)>=0;
}
var PROJECT_TEXT_FIELDS=['name','org','contactName','email','phone','service','source','tags','nextStep','liveUrl','adminUrl','repoUrl','domain','hosting','backend','integrations','architecture','scope','notes'];

function render(keepFocus){
  clearTimeout(render._c); render._c=setTimeout(saveCache, 400);
  var v=S.view, html='';
  var ms='<div class="mobile-search"><input type="search" id="q2" placeholder="Search…" value="'+esc(S.q)+'"><span class="mscope"><button data-scope="client"'+(S.scope==='client'?' class="on"':'')+'>Clients</button><button data-scope="all"'+(S.scope==='all'?' class="on"':'')+'>All</button></span></div>';
  if(v==='dash') html=ms+renderDash();
  if(v==='board') html=ms+renderBoard();
  if(v==='sites') html=ms+renderSites();
  if(v==='all') html=ms+renderAll();
  var focused = document.activeElement && document.activeElement.id==='q2';
  $('#main').innerHTML=html;
  var q2=$('#q2'); if(q2){ q2.oninput=function(){ S.q=this.value; $('#q').value=this.value; if(S.view==='dash'&&S.q){ S.view='all'; $$('#tabs button').forEach(function(x){ x.classList.toggle('on',x.dataset.view==='all'); }); } render(true); }; if(focused&&keepFocus){ q2.focus(); q2.setSelectionRange(q2.value.length,q2.value.length); } }
  $$('[data-open]').forEach(function(el){ el.onclick=function(){ openProject(el.dataset.open); }; });
  $$('.mscope button').forEach(function(b){ b.onclick=function(){ S.scope=b.dataset.scope; paintScope(); render(); }; });
  if(v==='board') wireBoard();
  if(v==='all'){
    $$('th[data-sort]').forEach(function(th){ th.onclick=function(){ var k=th.dataset.sort; S.sort = S.sort.k===k?{k:k,dir:-S.sort.dir}:{k:k,dir:1}; render(); }; });
    var sf=$('#stageFilter'); if(sf) sf.onchange=function(){ S.stageFilter=this.value; render(); };
  }
}

function renderDash(){
  var P=S.projects.filter(inScope), t=todayStr(), year=t.slice(0,4), stale=num(S.settings.staleDays)||14;
  var pipe=P.filter(function(p){ return p.stage==='lead'||p.stage==='discussion'; });
  var con=P.filter(function(p){ return p.stage==='contract'; });
  var live=P.filter(function(p){ return p.stage==='live'; });
  var booked=P.filter(function(p){ return (p.stage==='contract'||p.stage==='live'||p.stage==='closed') && String(p.contractDate).slice(0,4)===year; });
  var sum=function(a,k){ return a.reduce(function(s,p){ return s+num(p[k]); },0); };
  var outstanding=P.filter(function(p){ return p.stage==='contract'||p.stage==='live'||isWonDone(p); }).reduce(function(s,p){ return s+Math.max(0,num(p.value)-paidFor(p)); },0);
  var collectedYr=S.payments.filter(function(x){ var p=byId(x.projectId); return p&&inScope(p)&&String(x.date).slice(0,4)===year; }).reduce(function(t,x){ return t+num(x.amount); },0);

  var kpis='<div class="kpis">'+
    kpi('Open pipeline', pipe.length, money(sum(pipe,'value'))+' potential · '+P.filter(function(p){return p.stage==='lead';}).length+' new leads')+
    kpi('Under contract', con.length, money(sum(con,'value'))+' contracted')+
    kpi(S.scope==='client'?'Live client sites':'Live (everything)', live.length, money(sum(live,'monthly'))+'/mo recurring')+
    kpi('Booked '+year, money(sum(booked,'value')), money(collectedYr)+' collected · '+money(outstanding)+' to collect')+
  '</div>';

  // attention
  var att=[];
  P.forEach(function(p){
    var d;

function moveStage(p, stage, reason){
  if(stage==='closed' && reason===undefined){ askCloseReason(p, function(r){ moveStage(p, stage, r); }); return; }
  var patch={id:p.id, stage:stage};
  if(stage==='closed') patch.closedReason=reason||'';
  if(stage==='closed' && reason===WON_DONE && !p.deliveredDate) patch.deliveredDate=todayStr();
  if(stage==='contract' && !p.contractDate) patch.contractDate=todayStr();
  if(stage==='live' && !p.deliveredDate) patch.deliveredDate=todayStr();
  var old=Object.assign({},p); Object.assign(p,patch); render();
  api('saveProject',{project:patch}).then(function(j){ replaceProject(j.project); addLocalStageLog(p.id, old.stage, stage); render(); toast('Moved to '+STAGE[stage].label); })
    .catch(function(err){ Object.assign(p,old); render(); if(err.message!=='signed out') toast(err.message,true); });
}

function openProject(id, tab){
  var p=byId(id); if(!p) return;
  if(D && D.dirty && D.id!==id && !confirm('Discard unsaved changes to '+title(D.draft)+'?')) return;
  D={id:id, draft:Object.assign({},p), tab:tab||(D&&D.id===id?D.tab:'overview'), dirty:false};
  history.replaceState(null,'','#p='+encodeURIComponent(id));
  drawDrawer();
}
function closeDrawer(force){
  if(!force && D && D.dirty && !confirm('Discard unsaved changes?')) return;
  D=null; $('#drawer').classList.add('hidden'); $('#drawer').innerHTML=''; document.body.style.overflow='';
  history.replaceState(null,'',location.pathname+location.search);
}
function setDirty(v){ D.dirty=v; var s=$('#dstate'); if(s){ s.textContent=v?'Unsaved changes':'All changes saved'; s.className='state'+(v?' dirty':''); } var b=$('#dsave'); if(b) b.disabled=!v; }

function F(k, label, type, opt){
  opt=opt||{}; var v=D.draft[k]==null?'':D.draft[k], cls=opt.cls?' '+opt.cls:'';
  var open='';
  if(type==='url' && v) open=' '+link(v,'open ↗').replace('<a ','<a class="open" ');
  if(type==='email' && v) open=' <a class="open" href="mailto:'+esc(v)+'">email</a>';
  if(type==='tel' && v) open=' <a class="open" href="tel:'+esc(String(v).replace(/[^0-9+]/g,''))+'">call</a>';

  if(type==='textarea') inner='<textarea data-k="'+k+'"'+(opt.code?' class="code"':'')+' rows="'+(opt.rows||4)+'" placeholder="'+esc(opt.ph||'')+'">'+esc(v)+'</textarea>';

  var p=D.draft, tabs=[['overview','Overview'],['deal','Deal & dates'],['arch','Architecture'],['files','Contracts & files ('+filesFor(p.id).length+')'],['activity','Notes & activity']];

function stripInternal(md){
  var out=[], skip=0;
  String(md||'').split('\n').forEach(function(l){
    var m=l.match(/^(#{1,6})\s+(.*)/);
    if(m){ if(skip && m[1].length<=skip) skip=0; if(!skip && /internal/i.test(m[2])){ skip=m[1].length; return; } }
    if(!skip) out.push(l);
  });
  return out.join('\n');
}
function specRows(p, mode){

    .filter(function(r){ return r[1] && String(r[1]).trim(); });
  return [['Client',[p.name,p.org&&p.org!==p.name?p.org:''].filter(Boolean).join(' — ')],['Contact',[p.contactName,p.email,p.phone].filter(Boolean).join(' · ')],['Service',p.service],['Status',(STAGE[p.stage]||{}).label],
    ['Contract executed',fmtDate(p.contractDate)],['Delivery',fmtDate(p.deliveredDate||p.deliveryDue)+(p.deliveredDate?' (delivered)':p.deliveryDue?' (due)':'')],
    ['Live URL',p.liveUrl],['Admin URL',p.adminUrl],['Repo',p.repoUrl],['Backend Sheet',p.sheetUrl],['Apps Script / API',p.scriptUrl],['Domain',p.domain],
    ['Hosting',p.hosting],['Backend / data',p.backend],['Admin access',p.auth],['Integrations',p.integrations],['Accounts & ownership',p.accounts],['Renews',fmtDate(p.renewalDate)]]
    .filter(function(r){ return r[1] && String(r[1]).trim(); });

function specMarkdown(p, mode){
  var h=mode==='handoff', arch=h?stripInternal(p.architecture):p.architecture;
  var out=['# '+title(p)+(h?' — Handoff guide':' — Architecture'),''];
  specRows(p, mode).forEach(function(r){ out.push('- **'+r[0]+':** '+r[1]); });
  if(p.scope) out.push('','## Scope','',p.scope);
  if(arch&&arch.trim()) out.push('',h?'## How it works':'## Configuration','',arch);
  return out.join('\n');

function copy(t){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){ toast('Copied as Markdown'); }).catch(function(){
    var ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied as Markdown'); }catch(e){ toast('Copy failed',true); } ta.remove();
  });
}
function md(src){
  var lines=String(src||'').replace(/\r/g,'').split('\n'), out=[], list=null, code=null;
  var inline=function(s){
    s=esc(s);
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,function(m,t,u){ var h=safeUrl(u.replace(/&amp;/g,'&')); return h?'<a href="'+esc(h)+'" target="_blank" rel="noopener">'+t+'</a>':t; });
    s=s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,function(m,pre,u){ return pre+'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>'; });
    return s;
  };
  var close=function(){ if(list){ out.push('</'+list+'>'); list=null; } };
  lines.forEach(function(l){
    if(code!==null){ if(/^```/.test(l)){ out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>'); code=null; } else code.push(l); return; }
    if(/^```/.test(l)){ close(); code=[]; return; }
    var m;
    if((m=l.match(/^(#{1,3})\s+(.*)/))){ close(); var n=m[1].length+1; out.push('<h'+n+'>'+inline(m[2])+'</h'+n+'>'); return; }
    if((m=l.match(/^\s*[-*]\s+(.*)/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push('<li>'+inline(m[1])+'</li>'); return; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push('<li>'+inline(m[1])+'</li>'); return; }
    close();
    if(l.trim()) out.push('<p>'+inline(l)+'</p>');
  });
  if(code!==null) out.push('<pre><code>'+esc(code.join('\n'))+'</code></pre>');
  close();
  return out.join('');
}

function parseConsult(t){
  var out={}, m;
  if((m=t.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i))) out.email=m[0];
  if((m=t.match(/(\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]?\d{3}[\s.-]?\d{4}/))) out.phone=m[0].trim();
  var urls=t.match(/https?:\/\/[^\s)>,]+|\b[a-z0-9-]+\.(com|org|net|church|io|co|us|app)\b(\/[^\s)>,]*)?/gi)||[];
  urls=urls.filter(function(u){ return !(out.email && out.email.indexOf(u)>=0); });
  if(urls.length) out.liveUrl=urls[0];
  var lines=t.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  lines.forEach(function(l){
    var kv=l.match(/^(name|contact|client|org|organization|group|business|company|service|need|budget|price|deadline|due|date)\s*[:\-–]\s*(.+)$/i); if(!kv) return;
    var k=kv[1].toLowerCase(), v=kv[2].trim();
    if(k==='name'||k==='contact') out.contactName=out.contactName||v;
    else if(k==='client'||k==='org'||k==='organization'||k==='group'||k==='business'||k==='company') out.org=out.org||v;
    else if(k==='service'||k==='need') out.service=SERVICES.filter(function(sv){ return v.toLowerCase().indexOf(sv.toLowerCase().split(' ')[0])>=0; })[0]||out.service;
    else if(k==='budget'||k==='price'){ var n=v.replace(/[^0-9.]/g,''); if(n) out.value=n; }
    else if(k==='deadline'||k==='due'||k==='date'){ var d=new Date(v); if(!isNaN(d)) out.deliveryDue=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  });
  return out;
}

  $('#nName').focus();
  $('#nNotes').oninput=function(){
    var x=parseConsult(this.value), got=[];
    if(x.email){ if(!$('#nEmail').value) $('#nEmail').value=x.email; got.push('email'); }
    if(x.contactName){ if(!$('#nContact').value) $('#nContact').value=x.contactName; got.push('contact'); }
    if(x.org){ if(!$('#nName').value) $('#nName').value=x.org; got.push('organization'); }
    if(x.service){ $('#nService').value=x.service; got.push('service'); }
    if(x.phone) got.push('phone'); if(x.liveUrl) got.push('URL'); if(x.value) got.push('budget'); if(x.deliveryDue) got.push('deadline');
    $('#nParsed').textContent=got.length?'Picked up: '+got.join(', '):'';
  };
  $('#nSave').onclick=function(){
    var name=$('#nName').value.trim(); if(!name){ $('#mErr').textContent='Give it a name.'; return; }
    var stage=$('#nStage').value, notes=$('#nNotes').value.trim(), x=notes?parseConsult(notes):{};
    var p={name:name, contactName:$('#nContact').value.trim(), email:$('#nEmail').value.trim(), stage:stage, type:$('#nType').value, service:$('#nService').value, source:$('#nSource').value, firstContact:todayStr(), nextDate:$('#nNext').value, nextStep: stage==='lead'?'Reply and book 30-min consult':''};
    if(x.org && x.org!==name) p.org=x.org;
    if(x.phone) p.phone=fmtPhone(x.phone); if(x.liveUrl) p.liveUrl=x.liveUrl; if(x.value) p.value=x.value; if(x.deliveryDue) p.deliveryDue=x.deliveryDue;
    if(notes){ p.scope=notes; if(stage==='lead'||stage==='discussion') p.consultDate=todayStr(); }
    if(stage==='contract') p.contractDate=todayStr();
    var btn=this; btn.disabled=true;
    api('saveProject',{project:p}).then(function(j){
      S.projects.push(j.project); S.log.push({id:'tmp'+Date.now(), projectId:j.project.id, ts:new Date().toISOString(), type:'stage', text:'created→'+j.project.stage});
      var after=notes?api('addLog',{projectId:j.project.id, type:'meeting', text:'Consult notes:\n'+notes}).then(function(r){ S.log.push(r.entry); }):Promise.resolve();
      return after.then(function(){ closeModal(); render(); openProject(j.project.id); });
    }).catch(function(e){ btn.disabled=false; if(e.message!=='signed out') $('#mErr').textContent=e.message; });
  };
}
$('#newBtn').onclick=function(){ openNew(); };
$('#fab').onclick=function(){ openNew({stage:'lead'}); };

function openSettings(){
  $('#menuPop').classList.add('hidden');
  var st=S.settings||{};
  modal('<h2>Settings &amp; automations</h2>'+
    '<div class="section"><h3>Automations</h3><p class="hint" style="margin-top:4px">'+(st.automations?'<span class="dot ok"></span> On: site checks + client email sync nightly at 3 AM; digest Mondays at 7 AM.':'<span class="dot"></span> Off.')+'</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" id="stTrig">'+(st.automations?'Reinstall automations':'Turn on automations')+'</button><button class="btn ghost sm" id="stHealth">Run site checks</button><button class="btn ghost sm" id="stMail">Sync client email</button><button class="btn ghost sm" id="stDigest">Send digest now</button></div>'+
    '<p class="hint">Email sync reads only threads with each Client project’s email address and logs subject + first lines. Last sync: '+(st.lastEmailSync?fmtTs(st.lastEmailSync):'never')+'.</p></div>'+
    '<div class="grid"><label class="f">Send digest + alerts to<input type="email" id="stTo" value="'+esc(st.digestTo||'')+'"></label>'+
    '<label class="f">“Gone quiet” after (days)<input type="number" min="1" id="stStale" value="'+esc(st.staleDays||14)+'"></label>'+
    '<label class="f span3">Contract template (Google Doc link)<input type="url" id="stTpl" value="'+esc(st.contractTemplateUrl||'')+'" placeholder="https://docs.google.com/document/d/…"></label></div>'+
    '<p class="hint">Template placeholders: {{provider}} {{client}} {{org}} {{contactName}} {{email}} {{phone}} {{service}} {{scope}} {{value}} {{deposit}} {{balance}} {{monthly}} {{deliveryDue}} {{date}} {{liveUrl}} {{domain}}'+
    '</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">'+(st.contractTemplateUrl?'<a class="btn ghost sm" href="'+esc(st.contractTemplateUrl)+'" target="_blank" rel="noopener">Open &amp; edit template</a>':'')+
    '<button class="btn sm" id="stMakeTpl">'+(st.contractTemplateUrl?'Create a fresh starter agreement':'Create starter agreement')+'</button></div>'+
    '<p class="err" id="mErr"></p><div class="acts"><button class="btn ghost" data-close>Close</button><button class="btn" id="stSave">Save settings</button></div>');
  var busy=function(b,t){ b.disabled=true; b.dataset.t=b.textContent; b.textContent=t; }, done=function(b){ b.disabled=false; b.textContent=b.dataset.t; };
  var fail=function(b){ return function(e){ done(b); if(e.message!=='signed out') $('#mErr').textContent=e.message; }; };
  $('#stTrig').onclick=function(){ var b=this; busy(b,'Turning on…'); api('installTriggers').then(function(j){ S.settings=j.settings; openSettings(); toast('Automations on'); }).catch(fail(b)); };
  $('#stHealth').onclick=function(){ var b=this; busy(b,'Checking…'); api('runHealth').then(function(j){ S.health=j.health||[]; S.settings.lastHealth=new Date().toISOString(); done(b); render(); var bad=S.health.filter(function(h){ return h.ok==='no'; }).length; toast(bad?bad+' failing — see dashboard':'All '+S.health.length+' passing', !!bad); }).catch(fail(b)); };
  $('#stMail').onclick=function(){ var b=this; busy(b,'Syncing…'); api('syncEmail').then(function(j){ S.log=j.log||S.log; S.projects=j.projects||S.projects; S.settings.lastEmailSync=new Date().toISOString(); done(b); render(); toast(j.added+' new email'+(j.added===1?'':'s')+' logged'); }).catch(fail(b)); };
  $('#stDigest').onclick=function(){ var b=this; busy(b,'Sending…'); api('sendDigest').then(function(){ done(b); toast('Digest sent to '+(S.settings.digestTo||'you')); }).catch(fail(b)); };
  var mk=$('#stMakeTpl'); if(mk) mk.onclick=function(){ if(S.settings.contractTemplateUrl && !confirm('Create a new full starter agreement and use it as your template? Your current template Doc stays in the folder.')) return; mk.textContent='Creating…'; api('createContractTemplate').then(function(j){ S.settings=j.settings; openSettings(); window.open(j.settings.contractTemplateUrl,'_blank','noopener'); toast('Starter agreement created — review and edit it in Google Docs'); }).catch(fail(mk)); };
  $('#stSave').onclick=function(){ var b=this; busy(b,'Saving…'); api('saveSettings',{settings:{digestTo:$('#stTo').value, staleDays:$('#stStale').value, contractTemplateId:$('#stTpl').value}}).then(function(j){ S.settings=Object.assign(S.settings,j.settings); closeModal(); render(); toast('Settings saved'); }).catch(fail(b)); };
}
$('#settingsBtn').onclick=openSettings;

$('#menuBtn').onclick=function(e){ e.stopPropagation(); $('#menuPop').classList.toggle('hidden'); };
document.addEventListener('click',function(e){ if(!e.target.closest('.menu')) $('#menuPop').classList.add('hidden'); });
$('#refreshBtn').onclick=function(){ $('#menuPop').classList.add('hidden'); if(D&&D.dirty&&!confirm('Discard unsaved changes?')) return; closeDrawer(true); boot().then(function(){ toast('Refreshed'); }); };
$('#logoutBtn').onclick=function(){ if(D&&D.dirty&&!confirm('Discard unsaved changes?')) return; clearToken(); S.projects=[]; S.log=[]; S.files=[]; $('#main').innerHTML=''; showLogin('Signed out.'); };
$('#pwBtn').onclick=function(){
  $('#menuPop').classList.add('hidden');
  modal('<h2>Change password</h2><div class="grid"><label class="f span3">Current password<input type="password" id="cpOld" autocomplete="current-password"></label><label class="f span3">New password (10+ characters)<input type="password" id="cpNew" autocomplete="new-password"></label><label class="f span3">New password again<input type="password" id="cpNew2" autocomplete="new-password"></label></div><p class="hint">Changing it signs out every other device.</p><p class="err" id="mErr"></p><div class="acts"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="cpSave">Change</button></div>');
  $('#cpSave').onclick=function(){
    var n=$('#cpNew').value; if(n.length<10){ $('#mErr').textContent='At least 10 characters.'; return; } if(n!==$('#cpNew2').value){ $('#mErr').textContent='New passwords don’t match.'; return; }
    var remember=false; try{ remember=!!localStorage.getItem(TOKEN_KEY); }catch(e){}
    this.disabled=true;
    api('changePassword',{oldPassword:$('#cpOld').value, newPassword:n, remember:remember}).then(function(j){ setToken(j.token, remember); closeModal(); toast('Password changed'); })
      .catch(function(e){ $('#cpSave').disabled=false; if(e.message!=='signed out') $('#mErr').textContent=e.message; });
  };
};

document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key==='s'&&D){ e.preventDefault(); saveDraft(); }
  if(e.key==='Escape'){ if(!$('#modal').classList.contains('hidden')) closeModal(); else if(!$('#spec').classList.contains('hidden')) $('#spec').classList.add('hidden'); else if(D) closeDrawer(); }
});
(function(){ var mq=window.matchMedia('(max-width:720px)'), f=function(){ if(!$('#app').classList.contains('hidden')) render(); }; if(mq.addEventListener) mq.addEventListener('change',f); else if(mq.addListener) mq.addListener(f); })();
window.addEventListener('beforeunload',function(e){ if(D&&D.dirty){ e.preventDefault(); e.returnValue=''; } });
$('#yr').textContent=new Date().getFullYear();

/* ================= start ================= */
if(!API){
  $('#login').classList.remove('hidden');
  $('#loginForm').innerHTML='<img src="../assets/logo-full.png" alt="The Herd Co."><h1>Operations</h1><p class="muted">Not connected yet. Deploy the ops Sheet’s Apps Script and paste its /exec URL into <code>assets/ops-config.js</code>.</p>';
} else if(getToken()) boot();
else showLogin();
})();
</script>
