<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | The Herd Co.</title>
<meta name="theme-color" content="#163823">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#163823; --green-2:#1f4a30; --ink:#1b211d; --muted:#5b665f;
    --paper:#f6f4ee; --card:#ffffff; --line:#dfdbd0; --tan:#c9b48a;
    --radius:14px; --max:1080px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:Barlow,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.55;font-size:17px}
  img{max-width:100%;display:block}
  a{color:var(--green)}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1.02;margin:0}
  h2{font-size:clamp(2rem,5vw,2.9rem);color:var(--green)}
  h3{font-size:1.45rem;color:var(--green)}
  .eyebrow{font-weight:600;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .lead{font-size:1.12rem;color:var(--muted);max-width:620px;margin:14px 0 0}
  section{padding:84px 0}

  /* nav */
  header.nav{position:sticky;top:0;z-index:10;background:rgba(246,244,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
  header.nav img{height:38px;width:auto}
  header.nav nav{display:flex;gap:22px;align-items:center}
  header.nav nav a{text-decoration:none;font-weight:600;font-size:.95rem;color:var(--ink)}
  header.nav nav a.hide-sm{}
  .btn{display:inline-block;background:var(--green);color:#fff !important;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px;transition:background .15s}
  .btn:hover{background:var(--green-2)}
  .btn.light{background:#fff;color:var(--green) !important}
  .btn.light:hover{background:#eef0ea}
  .btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.6)}
  @media (max-width:720px){ header.nav nav a.hide-sm{display:none} header.nav img{height:30px} header.nav nav{gap:14px} header.nav nav a{white-space:nowrap;font-size:.9rem} header.nav .btn{padding:10px 16px} header.nav .wrap{gap:16px} }
  @media (max-width:380px){ header.nav img{height:24px} header.nav nav{gap:10px} header.nav .btn{padding:9px 13px} }

  /* hero */
  .hero{background:var(--green);color:#fff;padding:90px 0 96px;position:relative;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:1.35fr .65fr;gap:40px;align-items:center}
  .hero h1{font-size:clamp(2.6rem,6vw,4.4rem)}
  .hero p{font-size:1.18rem;color:rgba(255,255,255,.85);max-width:520px;margin:20px 0 30px}
  .hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
  .hero .mark{opacity:.95;width:100%;max-width:420px;justify-self:end}
  .hero .tag{font-weight:600;font-size:.82rem;letter-spacing:.26em;text-transform:uppercase;color:var(--tan);margin:0 0 16px}
  @media (max-width:820px){ .hero .wrap{grid-template-columns:1fr} .hero .mark{display:none} }

  /* services */
  .grid3{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:40px}
  @media (max-width:860px){ .grid3{grid-template-columns:1fr} }
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px}
  .card p{margin:12px 0 0;color:var(--muted)}
  .card .ex{margin-top:16px;font-size:.88rem;color:var(--ink);border-top:1px dashed var(--line);padding-top:12px}
  .card .ex b{font-weight:600;color:var(--green)}
  .num{font-family:"Barlow Condensed";font-weight:700;font-size:1rem;color:var(--tan);letter-spacing:.1em}

  /* process */
  .process{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:44px;position:relative}
  .step{padding:0 18px 0 0;position:relative}
  .step .dot{width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed";font-weight:700;font-size:1.05rem;position:relative;z-index:1}
  .step.final .dot{background:var(--tan);color:var(--green)}
  .step:not(:last-child)::after{content:"";position:absolute;top:27px;left:54px;right:0;height:2px;background:var(--line)}
  .step h3{margin-top:18px;font-size:1.3rem}
  .step .time{font-weight:600;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .step p{color:var(--muted);margin:10px 0 0;font-size:.97rem}
  @media (max-width:860px){
    .steps{grid-template-columns:1fr;gap:28px}
    .step{display:grid;grid-template-columns:54px 1fr;column-gap:18px;padding:0}
    .step .dot{grid-row:span 3}
    .step h3{margin-top:4px}
    .step:not(:last-child)::after{top:54px;left:26px;right:auto;width:2px;height:calc(100% - 26px)}
  }
  .note{margin-top:40px;background:var(--paper);border-radius:var(--radius);padding:22px 26px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .note p{margin:0;max-width:660px}

  /* serve */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
  .chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 18px;font-weight:600;color:var(--green)}

  /* values */
  .values{background:var(--green);color:#fff}
  .values h2,.values h3{color:#fff}
  .values .eyebrow{color:var(--tan)}
  .vgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:40px}
  @media (max-width:960px){ .vgrid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:560px){ .vgrid{grid-template-columns:1fr} }
  .v{border-top:2px solid var(--tan);padding-top:16px}
  .v h3{font-size:1.3rem}
  .v p{color:rgba(255,255,255,.8);margin:8px 0 0;font-size:.97rem}

  /* contact */
  .contact{text-align:center}
  .contact .lead{margin:14px auto 30px}
  .form{max-width:640px;margin:0 auto;text-align:left;display:grid;gap:16px}
  .form .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:600px){ .form .row{grid-template-columns:1fr} }
  .form label{display:grid;gap:6px;font-weight:600;font-size:.92rem;color:var(--green)}
  .form input,.form select,.form textarea{font:inherit;font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
  .form input:focus,.form select:focus,.form textarea:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
  .form textarea{resize:vertical}
  .form button{justify-self:start;border:0;cursor:pointer;font:inherit;font-weight:600}
  .form button:disabled{opacity:.6;cursor:wait}
  .form .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .status{margin:0;min-height:1.4em;font-weight:500}
  .status.ok{color:var(--green)} .status.err{color:#a3361f}
  .subhead{font-size:1.6rem;margin-top:52px}
  .fine{color:var(--muted);font-size:.9rem;margin:6px 0 0}
  .projects{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:24px}
  @media (max-width:900px){ .projects{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:600px){ .projects{grid-template-columns:1fr} }
  .proj{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
  .proj:hover,.proj:focus-visible{transform:translateY(-3px);box-shadow:0 10px 24px rgba(22,56,35,.12)}
  .proj:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .proj .thumb{display:block;height:220px;overflow:hidden;background:#e9e6dc;border-bottom:1px solid var(--line)}
  .proj .thumb img{width:100%;height:auto;display:block}
  .proj .meta{display:flex;flex-direction:column;gap:4px;padding:16px 18px 18px}
  .proj .kind{font-weight:600;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--tan)}
  .proj b{font-family:"Barlow Condensed";font-size:1.35rem;text-transform:uppercase;color:var(--green);line-height:1.1}
  .proj .desc{color:var(--muted);font-size:.93rem}
  .proj .more{margin-top:6px;font-weight:600;font-size:.88rem;color:var(--green)}
  dialog#viewer{border:0;border-radius:16px;padding:0;width:min(960px,94vw);max-height:90vh;background:var(--paper)}
  dialog#viewer::backdrop{background:rgba(10,20,14,.7)}
  .vhead{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:var(--green);color:#fff;font-family:"Barlow Condensed";font-size:1.3rem;text-transform:uppercase;z-index:1}
  .vclose{all:unset;cursor:pointer;font-size:1.8rem;line-height:1;padding:0 6px}
  .vbody{padding:20px;display:grid;gap:18px}
  .vbody img{width:100%;max-width:820px;margin:0 auto;border-radius:10px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08)}
  footer{border-top:1px solid var(--line);padding:30px 0;color:var(--muted);font-size:.9rem}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
  footer img{height:30px;width:auto}
  footer .legal{display:block;font-size:.8rem;margin-top:4px}
  footer a{color:var(--muted)}
  .local{margin:22px 0 0;color:var(--muted);max-width:640px}
  .faq details{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-top:12px}
  .faq summary{cursor:pointer;font-weight:600;color:var(--green);font-size:1.05rem}
  .faq details p{margin:10px 0 0;color:var(--muted)}
  .direct{margin:14px 0 0;color:var(--muted)}
  .direct a{font-weight:600}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="wrap">
      <div>
        <p class="tag">404 · Page not found</p>
        <h1>This one wandered off from the herd.</h1>
        <p>The page you're looking for isn't here. Head back home or get in touch.</p>
        <div class="ctas">
          <a class="btn light" href="/">Back to home</a>
          <a class="btn ghost" href="/#contact">Get in touch</a>
        </div>
      </div>
      <img class="mark" src="/assets/bison-white.png" alt="" width="420" height="264">
    </div>
  </section>
</main>
</body>
</html>
